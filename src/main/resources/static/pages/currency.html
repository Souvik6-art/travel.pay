<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TravelPay | Currency Converter</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/currency.css">
    <!-- Font Awesome for swap icon -->
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >
</head>

<body>

<header class="navbar">

    <div class="logo">
        Travel<span>Pay</span>
    </div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="expenses.html">Expenses</a>
        <a href="transactions.html">Transactions</a>
        <a href="budget.html">Budget</a>
        <a href="reports.html">Reports</a>
        <a href="currency.html">Currency</a>
    </nav>

    <div class="nav-buttons">
        <button id="logoutBtn" class="login-btn">Logout</button>
    </div>

</header>


<main class="dashboard-container">

    <section class="dashboard-heading">

        <p class="hero-tag">TRAVELPAY CURRENCY</p>

        <h1>Currency Converter</h1>

        <p>
            Convert your money before you travel.
        </p>

    </section>


    <section class="deposit-section">

        <div class="deposit-card currency-container">

            <h2>Currency Converter</h2>


            <form id="currencyForm">

                <!-- Amount -->

                <div class="amount">

                    <p>Enter Amount</p>

                    <input
                            id="currencyAmount"
                            value="1"
                            type="number"
                            min="0.01"
                            step="0.01"
                    >

                </div>


                <!-- Currency Dropdowns -->

                <div class="dropdown">

                    <!-- FROM -->

                    <div class="from">

                        <p>From</p>

                        <div class="select-container">

                            <img
                                    id="fromFlag"
                                    alt="From currency flag"
                            >

                            <select
                                    name="from"
                                    id="fromCurrency"
                            ></select>

                        </div>

                    </div>


                    <!-- Swap -->

                    <i
                            id="swapCurrency"
                            class="fa-solid fa-arrow-right-arrow-left"
                    ></i>


                    <!-- TO -->

                    <div class="to">

                        <p>To</p>

                        <div class="select-container">

                            <img
                                    id="toFlag"
                                    alt="To currency flag"
                            >

                            <select
                                    name="to"
                                    id="toCurrency"
                            ></select>

                        </div>

                    </div>

                </div>


                <!-- Result -->

                <div id="currencyMessage" class="msg">
                    1 USD = 1 INR
                </div>


                <!-- Convert Button -->

                <button
                        type="submit"
                        class="currency-btn"
                >
                    Get Exchange Rate
                </button>

            </form>

        </div>

    </section>

</main>


<!-- Your original countryList -->
<script src="../js/codes.js"></script>

<!-- TravelPay authentication -->
<script src="../js/auth.js"></script>

<!-- Currency converter -->
<script src="../js/currency.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TravelPay | Expenses</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        Travel<span>Pay</span>
    </div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="expenses.html">Expenses</a>
        <a href="transactions.html">Transactions</a>
        <a href="budget.html">Budget</a>
        <a href="reports.html">Reports</a>
        <a href="currency.html">Currency</a>
    </nav>

    <div class="nav-buttons">
        <button id="logoutBtn" class="login-btn">
            Logout
        </button>
    </div>

</header>


<main class="dashboard-container">

    <section class="dashboard-heading">

        <p class="hero-tag">TRAVELPAY EXPENSES</p>

        <h1>
            Manage your expenses
        </h1>

        <p>
            Track where your travel money is being spent.
        </p>

    </section>


    <section class="deposit-section">

        <div class="deposit-card">

            <h2>Add New Expense</h2>

            <p>
                Record an expense from your travel wallet.
            </p>

            <form id="expenseForm">

                <div class="deposit-input">

                    <label for="expenseTitle">
                        Expense Title
                    </label>

                    <input
                            type="text"
                            id="expenseTitle"
                            placeholder="e.g. Hotel, Food, Taxi"
                            required
                    >

                </div>


                <div class="deposit-input">

                    <label for="expenseCategory">
                        Category
                    </label>

                    <input
                            type="text"
                            id="expenseCategory"
                            placeholder="e.g. Food"
                            required
                    >

                </div>


                <div class="deposit-input">

                    <label for="expenseAmount">
                        Amount
                    </label>

                    <input
                            type="number"
                            id="expenseAmount"
                            placeholder="Enter amount"
                            min="1"
                            step="0.01"
                            required
                    >

                </div>


                <button type="submit" class="deposit-btn">
                    Add Expense
                </button>

            </form>

            <p id="expenseMessage" class="deposit-message"></p>

        </div>

    </section>

</main>


<script src="../js/auth.js"></script>
<script src="../js/expenses.js"></script>

</body>

</html>

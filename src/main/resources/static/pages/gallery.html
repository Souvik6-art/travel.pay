<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>TravelPay | Gallery</title>

    <link
            rel="stylesheet"
            href="../css/style.css"
    >

    <link
            rel="stylesheet"
            href="../css/gallery.css"
    >

</head>

<body>

<header class="navbar">

    <div class="logo">
        Travel<span>Pay</span>
    </div>

    <nav>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="dashboard.html#tripsOverviewSection">
            Trips Overview
        </a>

        <a href="gallery.html" class="active">
            Gallery
        </a>

    </nav>

    <div class="nav-buttons">

        <button
                id="logoutBtn"
                class="login-btn"
        >
            Logout
        </button>

    </div>

</header>


<main class="gallery-page-container">

    <!-- PAGE HEADING -->

    <section class="gallery-heading">

        <p class="hero-tag">
            YOUR MEMORIES
        </p>

        <h1>
            Travel Gallery
        </h1>

        <p>
            Explore your travel memories, organized trip by trip.
        </p>

    </section>


    <!-- TRIP SELECTOR -->

    <!-- TRIP SELECTOR -->

    <section class="gallery-trip-selector">

        <div>

            <label for="galleryPageTripSelect">
                Select Trip
            </label>

            <select id="galleryPageTripSelect">

                <option value="">
                    -- Select a Trip --
                </option>

            </select>

        </div>

    </section>


    <!-- SELECTED TRIP INFORMATION -->

    <section
            id="selectedTripInfo"
            class="selected-trip-info"
            style="display: none;"
    >

        <div>

            <p class="trip-info-label">
                SELECTED TRIP
            </p>

            <h2 id="selectedTripName">
                Trip Name
            </h2>

            <p id="selectedTripDestination">
                Destination
            </p>

        </div>

    </section>


    <!-- PHOTO GRID -->

    <section class="gallery-content">

        <div
                id="galleryPhotoGrid"
                class="gallery-photo-grid"
        >

            <div class="gallery-empty-state">

                <div class="gallery-empty-icon">
                    📷
                </div>

                <h3>
                    Select a trip
                </h3>

                <p>
                    Choose a trip above to view its photos.
                </p>

            </div>

        </div>

    </section>

</main>

<!-- PHOTO ACTION MODAL -->
<div id="photoActionModal" class="photo-modal" style="display: none;">
    <div class="photo-modal-content">

        <button id="closePhotoModal" class="photo-modal-close"
                type="button" aria-label="Close">&times;</button>

        <img id="modalPhotoPreview" src="" alt="Selected travel photo">

        <h3 id="modalPhotoName">Photo name</h3>

        <div class="photo-modal-actions">
            <button id="renamePhotoBtn" type="button">
                Rename Photo
            </button>

            <button id="deletePhotoBtn" type="button">
                Delete Photo
            </button>
        </div>

    </div>
</div>

<!-- RENAME PHOTO MODAL -->
<div id="renamePhotoModal" class="photo-modal" style="display: none;">
    <div class="photo-modal-content rename-modal-content">

        <button id="closeRenameModal" class="photo-modal-close"
                type="button" aria-label="Close">&times;</button>

        <h3>Rename Photo</h3>

        <label for="newPhotoName">Photo name</label>
        <input id="newPhotoName" type="text" maxlength="255"
               placeholder="Enter a new photo name">

        <div class="photo-modal-actions">
            <button id="savePhotoNameBtn" type="button">
                Save Name
            </button>

            <button id="cancelRenameBtn" type="button">
                Cancel
            </button>
        </div>

    </div>
</div>


<script src="../js/auth.js"></script>
<script src="../js/gallery.js"></script>

</body>

</html>
